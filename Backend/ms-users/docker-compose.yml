services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: usuarios
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d usuarios"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 5001 --reload
    volumes:
      - .:/app
    environment:
      PYTHONPATH: /app/src
      API_HOST: 0.0.0.0
      API_PORT: "5001"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: usuarios
      DB_USER: admin
      DB_PASSWORD: admin123
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5001:5001"

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  dbdata:
