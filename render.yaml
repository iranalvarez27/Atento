# Este archivo es la "receta" que Render usará para construir y desplegar tu aplicación completa.
# Versión corregida según la documentación oficial de Render.

# Primero, definimos las bases de datos a nivel principal.
databases:
  # Servicio de Base de Datos PostgreSQL
  - name: atento-db      # Nombre para referenciar internamente
    plan: free          # Usamos el plan gratuito
    databaseName: usuarios # El nombre de la base de datos a crear
    user: admin         # El usuario a crear

# Segundo, definimos los otros servicios.
services:
  # Servicio 1: Tu API de FastAPI
  - type: web           # Es un servicio web
    name: atento-api    # Nombre del servicio
    runtime: docker     # Se construye con Docker
    rootDir: Backend/ms-users # Ruta a la carpeta del backend
    plan: free          # Usamos el plan gratuito
    # La línea 'startCommand' ha sido eliminada.
    # Render usará la instrucción 'CMD' del Dockerfile para iniciar el servicio.
    envVars:
      - key: PYTHONPATH
        value: /app/src
      # Obtenemos los datos de conexión desde el servicio de base de datos
      # usando la sintaxis correcta 'fromDatabase'.
      - key: DB_HOST
        fromDatabase:
          name: atento-db  # Coincide con el 'name' de la base de datos
          property: host
      - key: DB_NAME
        fromDatabase:
          name: atento-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: atento-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: atento-db
          property: password

